<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Public Issue Details - CityFix</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased"><header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"><a href="/" class="flex items-center gap-2.5"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md"><i data-lucide="shield-check" class="w-6 h-6"></i></div><span class="text-xl font-extrabold" data-brand-name>CityFix</span></a><div id="nav-auth-container" class="hidden md:flex items-center gap-3"></div></div></header>
<main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10"><a href="/explore" class="inline-flex items-center gap-2 text-sm font-bold text-blue-600 hover:text-blue-800"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Explore</a><p id="public-error" class="hidden mt-6 rounded-xl bg-rose-50 p-4 text-sm font-semibold text-rose-700"></p><section id="public-content" class="hidden mt-6"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6"><div><p class="text-sm font-bold uppercase tracking-widest text-blue-600">Public issue</p><h1 id="public-id" class="mt-1 text-3xl font-black"></h1><p id="public-category" class="mt-2 text-slate-600"></p></div><span id="public-status" class="rounded-full px-4 py-2 text-sm font-bold"></span></div><div class="grid lg:grid-cols-[0.9fr_1.1fr] gap-6"><div class="rounded-3xl bg-white border border-slate-200 shadow-sm overflow-hidden"><img id="public-image" class="hidden w-full aspect-[4/3] object-cover" alt="Civic issue"><div id="public-no-image" class="aspect-[4/3] flex items-center justify-center bg-slate-100 text-slate-400"><i data-lucide="image-off" class="w-10 h-10"></i></div><div class="p-6"><h2 class="font-black text-lg">General location</h2><p id="public-address" class="mt-2 text-sm text-slate-600"></p><p id="public-coordinates" class="mt-2 text-xs text-slate-500"></p></div></div><div class="space-y-5"><div class="grid grid-cols-2 sm:grid-cols-4 gap-3"><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Confidence</p><p id="public-confidence" class="mt-1 text-xl font-black"></p></div><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Severity</p><p id="public-severity" class="mt-1 text-xl font-black"></p></div><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Priority</p><p id="public-priority" class="mt-1 text-xl font-black"></p></div><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Level</p><p id="public-level" class="mt-1 text-xl font-black"></p></div></div><div class="rounded-3xl bg-white border border-slate-200 shadow-sm p-6"><dl class="space-y-5 text-sm"><div><dt class="font-bold">Issue description</dt><dd id="public-description" class="mt-1 text-slate-600"></dd></div><div><dt class="font-bold">Recommended action</dt><dd id="public-action" class="mt-1 text-slate-600"></dd></div><div><dt class="font-bold">Reported</dt><dd id="public-created" class="mt-1 text-slate-600"></dd></div><div><dt class="font-bold">Last updated</dt><dd id="public-updated" class="mt-1 text-slate-600"></dd></div></dl></div></div></div></section><section id="public-timeline-section" class="hidden mt-8 rounded-3xl bg-white border border-slate-200 shadow-sm p-6"><div class="flex items-center gap-3"><i data-lucide="route" class="w-5 h-5 text-blue-600"></i><h2 class="text-xl font-black">Status timeline</h2></div><div id="public-timeline" class="mt-6 grid gap-4"></div></section><section id="public-map-section" class="hidden mt-8 rounded-3xl bg-white border border-slate-200 shadow-sm p-6"><h2 class="text-xl font-black mb-4">Issue location</h2><div id="public-detail-map"></div></section></main>
<footer class="bg-slate-900 text-slate-400 py-8 text-center text-xs"><p>&copy; 2026 CityFix Platform. Building cleaner, safer and smarter cities together.</p></footer>
<script src="/static/js/app.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const identifier=new URLSearchParams(window.location.search).get('id'); const errorBox=document.getElementById('public-error'); const workflow=['Submitted','Under Review','Assigned','In Progress','Resolved']; function setText(id,value){document.getElementById(id).textContent=value??'Not available';} function showError(text){errorBox.textContent=text;errorBox.classList.remove('hidden');} function statusClass(status){return {Submitted:'bg-blue-50 text-blue-700','Under Review':'bg-violet-50 text-violet-700',Assigned:'bg-indigo-50 text-indigo-700','In Progress':'bg-amber-50 text-amber-700',Resolved:'bg-emerald-50 text-emerald-700',Rejected:'bg-rose-50 text-rose-700'}[status]||'bg-slate-100 text-slate-700';} function renderTimeline(report){const timeline=document.getElementById('public-timeline');timeline.innerHTML=(report.status_history||[]).map((entry,index)=>`<div class="flex gap-4"><div class="flex flex-col items-center"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${index===report.status_history.length-1?'bg-blue-100 text-blue-700 ring-2 ring-blue-300':'bg-emerald-100 text-emerald-700'}"><i data-lucide="${index===report.status_history.length-1?'circle':'check'}" class="w-4 h-4"></i></span>${index<report.status_history.length-1?'<span class="mt-1 h-full min-h-6 w-px bg-emerald-200"></span>':''}</div><div><p class="font-bold">${entry.status}${index===report.status_history.length-1?' (Current status)':''}</p><p class="text-xs text-slate-500">${new Date(entry.created_at).toLocaleString()}</p></div></div>`).join('');document.getElementById('public-timeline-section').classList.remove('hidden');lucide.createIcons();}
async function load(){if(!identifier){showError('No public report was selected.');return;}try{const response=await fetch(`/api/reports/public/${encodeURIComponent(identifier)}`);const report=await response.json();if(!response.ok)throw new Error(report.detail||'Public report not found.');setText('public-id',report.tracking_number);setText('public-category',report.category);setText('public-address',report.address||'General location unavailable');setText('public-coordinates',`${report.latitude}, ${report.longitude}`);setText('public-confidence',report.ai_confidence==null?'Not available':`${Math.round(report.ai_confidence*100)}%`);setText('public-severity',report.severity);setText('public-priority',`${report.priority_score}/100`);setText('public-level',report.priority_level||'Not available');setText('public-description',report.description);setText('public-action',report.recommended_action||'Not available');setText('public-created',new Date(report.created_at).toLocaleString());setText('public-updated',new Date(report.updated_at).toLocaleString());const status=document.getElementById('public-status');status.textContent=report.status;status.className=`rounded-full px-4 py-2 text-sm font-bold ${statusClass(report.status)}`;if(report.image_url){document.getElementById('public-image').src=report.image_url;document.getElementById('public-image').classList.remove('hidden');document.getElementById('public-no-image').classList.add('hidden');}document.getElementById('public-content').classList.remove('hidden');renderTimeline(report);const map=L.map('public-detail-map').setView([report.latitude,report.longitude],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);L.marker([report.latitude,report.longitude]).addTo(map);document.getElementById('public-map-section').classList.remove('hidden');lucide.createIcons();}catch(error){showError(error.message||'Unable to load this issue.');}} document.addEventListener('DOMContentLoaded',load);
</script></body></html>
