<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Details - CityFix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"><a href="/" class="flex items-center gap-2.5"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md"><i data-lucide="shield-check" class="w-6 h-6"></i></div><span class="text-xl font-extrabold tracking-tight" data-brand-name>CityFix</span></a><div id="nav-auth-container" class="hidden md:flex items-center gap-3"></div></div></header>
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10"><a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-blue-600 hover:text-blue-800"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to dashboard</a><div id="detail-error" class="hidden mt-6 rounded-xl bg-rose-50 p-4 text-sm font-semibold text-rose-700"></div><section id="detail-content" class="hidden mt-6"><div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6"><div><p class="text-sm font-bold uppercase tracking-widest text-blue-600">My report</p><h1 id="detail-id" class="mt-1 text-3xl font-black"></h1><p id="detail-category" class="mt-2 text-slate-600"></p></div><span id="detail-status" class="self-start rounded-full px-4 py-2 text-sm font-bold"></span></div><div class="grid lg:grid-cols-[0.9fr_1.1fr] gap-6"><div class="overflow-hidden rounded-3xl bg-white border border-slate-200 shadow-sm"><img id="detail-image" class="hidden w-full aspect-[4/3] object-cover" alt="Uploaded civic issue image"><div id="detail-no-image" class="aspect-[4/3] flex items-center justify-center bg-slate-100 text-slate-400"><i data-lucide="image-off" class="w-10 h-10"></i></div><div class="p-6"><h2 class="font-black text-lg">Location</h2><p id="detail-address" class="mt-2 text-sm text-slate-600"></p><p id="detail-coordinates" class="mt-2 text-xs text-slate-500"></p></div></div><div class="space-y-5"><div class="grid grid-cols-2 sm:grid-cols-4 gap-3"><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Confidence</p><p id="detail-confidence" class="mt-1 text-xl font-black"></p></div><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Severity</p><p id="detail-severity" class="mt-1 text-xl font-black"></p></div><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Priority</p><p id="detail-priority" class="mt-1 text-xl font-black"></p></div><div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs text-slate-500">Level</p><p id="detail-level" class="mt-1 text-xl font-black"></p></div></div><div class="rounded-3xl bg-white border border-slate-200 shadow-sm p-6"><dl class="space-y-5 text-sm"><div><dt class="font-bold text-slate-900">AI description</dt><dd id="detail-description" class="mt-1 text-slate-600"></dd></div><div><dt class="font-bold text-slate-900">Recommended action</dt><dd id="detail-action" class="mt-1 text-slate-600"></dd></div><div><dt class="font-bold text-slate-900">Submitted</dt><dd id="detail-created" class="mt-1 text-slate-600"></dd></div><div><dt class="font-bold text-slate-900">Last updated</dt><dd id="detail-updated" class="mt-1 text-slate-600"></dd></div></dl></div></div></div></section><section id="timeline-section" class="hidden mt-8 rounded-3xl bg-white border border-slate-200 shadow-sm p-6"><div class="flex items-center gap-3"><i data-lucide="route" class="w-5 h-5 text-blue-600"></i><h2 class="text-xl font-black">Status timeline</h2></div><div id="status-timeline" class="mt-6 grid gap-4"></div></section></main>
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-xs"><p>&copy; 2026 CityFix Platform. Building cleaner, safer and smarter cities together.</p></footer>
    <script src="/static/js/app.js"></script>
    <script>
        const token = localStorage.getItem("cityfix_token");
        const currentUser = JSON.parse(localStorage.getItem("cityfix_user") || "null");
        const identifier = new URLSearchParams(window.location.search).get("id");
        const errorBox = document.getElementById("detail-error");
        function showError(message) { errorBox.textContent = message; errorBox.classList.remove("hidden"); }
        function escape(value) { const div = document.createElement("div"); div.textContent = String(value ?? ""); return div.innerHTML; }
        function statusClass(status) { return { Submitted: "bg-blue-50 text-blue-700", "Under Review": "bg-violet-50 text-violet-700", Assigned: "bg-indigo-50 text-indigo-700", "In Progress": "bg-amber-50 text-amber-700", Resolved: "bg-emerald-50 text-emerald-700", Rejected: "bg-rose-50 text-rose-700" }[status] || "bg-slate-100 text-slate-700"; }
        function setText(id, value) { document.getElementById(id).textContent = value ?? "Not available"; }
        const workflow = ["Submitted", "Under Review", "Assigned", "In Progress", "Resolved"];
        function renderTimeline(report) {
            const history = report.status_history || [];
            const currentIndex = workflow.indexOf(report.status);
            const timeline = document.getElementById("status-timeline");
            timeline.innerHTML = history.map((entry, index) => { const current = index === history.length - 1 && entry.status === report.status; return `<div class="flex gap-4"><div class="flex flex-col items-center"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${current ? "bg-blue-100 text-blue-700 ring-2 ring-blue-300" : "bg-emerald-100 text-emerald-700"}"><i data-lucide="${current ? "circle" : "check"}" class="w-4 h-4"></i></span>${index < history.length - 1 ? '<span class="mt-1 h-full min-h-6 w-px bg-emerald-200"></span>' : ""}</div><div class="pb-3"><p class="font-bold ${current ? "text-blue-700" : "text-slate-900"}">${escape(entry.status)}${current ? " (Current status)" : ""}</p><p class="text-xs text-slate-500">${new Date(entry.created_at).toLocaleString()}</p>${entry.note ? `<p class="mt-1 text-sm text-slate-600">${escape(entry.note)}</p>` : ""}</div></div>`; }).join("");
            const historyStatuses = new Set(history.map(entry => entry.status));
            workflow.filter(status => !historyStatuses.has(status) && status !== "Resolved").forEach((status) => {
                const isCurrent = status === report.status || (currentIndex === -1 && status === report.status);
                timeline.insertAdjacentHTML("beforeend", `<div class="flex gap-4"><div class="flex flex-col items-center"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${isCurrent ? "bg-blue-100 text-blue-700 ring-2 ring-blue-300" : "bg-slate-100 text-slate-400"}"><i data-lucide="${isCurrent ? "circle" : "circle-dot"}" class="w-4 h-4"></i></span></div><div><p class="font-bold ${isCurrent ? "text-blue-700" : "text-slate-500"}">${status}${isCurrent ? " (Current status)" : ""}</p><p class="text-xs text-slate-400">Upcoming</p></div></div>`);
            });
            if (report.status === "Rejected" && !historyStatuses.has("Rejected")) timeline.insertAdjacentHTML("beforeend", '<div class="flex gap-4"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-rose-100 text-rose-700"><i data-lucide="x" class="w-4 h-4"></i></div><div><p class="font-bold text-rose-700">Rejected (Current status)</p><p class="text-xs text-slate-400">Status closed</p></div></div>');
            document.getElementById("timeline-section").classList.remove("hidden");
            lucide.createIcons();
        }
        async function loadDetails() {
            if (!token) { window.location.href = `/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}`; return; }
            if (!identifier) { showError("No report was selected."); return; }
            try {
                const detailEndpoint = ["authority", "admin"].includes(currentUser?.role) ? `/api/reports/${encodeURIComponent(identifier)}` : `/api/reports/mine/${encodeURIComponent(identifier)}`;
                const response = await fetch(detailEndpoint, { headers: { Authorization: `Bearer ${token}` } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Report not found.");
                setText("detail-id", data.tracking_number); setText("detail-category", data.category); setText("detail-address", data.address || "Address unavailable"); setText("detail-coordinates", `${data.latitude}, ${data.longitude}`); setText("detail-confidence", data.ai_confidence == null ? "Not available" : `${Math.round(data.ai_confidence * 100)}%`); setText("detail-severity", data.severity); setText("detail-priority", `${data.priority_score}/100`); setText("detail-level", data.priority_level || "Not available"); setText("detail-description", data.description); setText("detail-action", data.recommended_action || "Not available"); setText("detail-created", new Date(data.created_at).toLocaleString()); setText("detail-updated", new Date(data.updated_at).toLocaleString());
                const status = document.getElementById("detail-status"); status.textContent = data.status; status.className = `self-start rounded-full px-4 py-2 text-sm font-bold ${statusClass(data.status)}`;
                if (data.image_url) { const image = document.getElementById("detail-image"); image.src = data.image_url; image.classList.remove("hidden"); document.getElementById("detail-no-image").classList.add("hidden"); }
                document.getElementById("detail-content").classList.remove("hidden"); renderTimeline(data); lucide.createIcons();
            } catch (error) { showError(error.message); }
        }
        document.addEventListener("DOMContentLoaded", loadDetails);
    </script>
</body>
</html>
