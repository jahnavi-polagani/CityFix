<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - CityFix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900" data-brand-name>CityFix</span>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm font-semibold text-slate-700 hover:text-blue-600 transition">Home</a>
                <a href="/report" class="text-sm font-semibold text-slate-700 hover:text-blue-600 transition">Report Issue</a>
                <a href="/explore" class="text-sm font-semibold text-slate-700 hover:text-blue-600 transition">Explore Issues</a>
                <a href="/dashboard" class="text-sm font-semibold text-slate-700 hover:text-blue-600 transition">Dashboard</a>
            </nav>
            <div class="flex items-center gap-2">
                <a href="/" class="text-sm font-bold text-slate-700 hover:text-blue-600">&larr; Back to Home</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 border border-slate-200 shadow-xl">
            <div class="text-center space-y-2 mb-7">
                <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mx-auto"><i data-lucide="shield-check" class="w-7 h-7"></i></div>
                <h1 id="auth-title" class="text-2xl font-black text-slate-900">Welcome back</h1>
                <p id="auth-subtitle" class="text-sm text-slate-500">Sign in to manage your CityFix reports.</p>
            </div>
            <div class="grid grid-cols-2 rounded-xl bg-slate-100 p-1 mb-6">
                <button id="login-tab" type="button" class="rounded-lg bg-white px-3 py-2 text-sm font-bold text-blue-700 shadow-sm">Login</button>
                <button id="register-tab" type="button" class="rounded-lg px-3 py-2 text-sm font-bold text-slate-600">Sign Up</button>
            </div>
            <form id="login-form" class="space-y-4">
                <div><label for="login-email" class="block text-sm font-bold text-slate-800 mb-2">Email</label><input id="login-email" type="email" required autocomplete="email" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm"></div>
                <div><label for="login-password" class="block text-sm font-bold text-slate-800 mb-2">Password</label><input id="login-password" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm"></div>
                <button id="login-button" class="w-full rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-bold text-white hover:bg-blue-700">Login</button>
            </form>
            <form id="register-form" class="hidden space-y-4">
                <div><label for="register-name" class="block text-sm font-bold text-slate-800 mb-2">Full name</label><input id="register-name" type="text" required minlength="2" autocomplete="name" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm"></div>
                <div><label for="register-email" class="block text-sm font-bold text-slate-800 mb-2">Email</label><input id="register-email" type="email" required autocomplete="email" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm"></div>
                <div><label for="register-password" class="block text-sm font-bold text-slate-800 mb-2">Password</label><input id="register-password" type="password" required minlength="8" autocomplete="new-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm"><p class="mt-1 text-xs text-slate-500">Use at least 8 characters.</p></div>
                <div><label for="register-confirm" class="block text-sm font-bold text-slate-800 mb-2">Confirm password</label><input id="register-confirm" type="password" required minlength="8" autocomplete="new-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm"></div>
                <button id="register-button" class="w-full rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-bold text-white hover:bg-blue-700">Create Citizen Account</button>
            </form>
            <p id="auth-message" class="hidden mt-5 rounded-xl p-3 text-sm font-semibold"></p>
            <p class="mt-6 text-center text-xs text-slate-500"><a href="/" class="font-bold text-blue-600 hover:underline">Back to CityFix</a></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-xs border-t border-slate-800">
        <p>&copy; 2026 CityFix Platform. Building cleaner, safer and smarter cities together.</p>
    </footer>

    <script src="/static/js/app.js"></script>
    <script>
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const authMessage = document.getElementById("auth-message");
        const nextPath = new URLSearchParams(window.location.search).get("next") || "/dashboard";

        function showAuthMessage(message, isError = true) {
            authMessage.textContent = message;
            authMessage.className = isError ? "mt-5 rounded-xl bg-rose-50 p-3 text-sm font-semibold text-rose-700" : "mt-5 rounded-xl bg-emerald-50 p-3 text-sm font-semibold text-emerald-700";
        }
        function saveSession(data) {
            localStorage.setItem("cityfix_token", data.access_token);
            localStorage.setItem("cityfix_user", JSON.stringify(data.user));
            window.location.href = nextPath;
        }
        function setMode(register) {
            loginForm.classList.toggle("hidden", register);
            registerForm.classList.toggle("hidden", !register);
            document.getElementById("login-tab").className = register ? "rounded-lg px-3 py-2 text-sm font-bold text-slate-600" : "rounded-lg bg-white px-3 py-2 text-sm font-bold text-blue-700 shadow-sm";
            document.getElementById("register-tab").className = register ? "rounded-lg bg-white px-3 py-2 text-sm font-bold text-blue-700 shadow-sm" : "rounded-lg px-3 py-2 text-sm font-bold text-slate-600";
            document.getElementById("auth-title").textContent = register ? "Create your account" : "Welcome back";
            document.getElementById("auth-subtitle").textContent = register ? "Track your civic reports from one place." : "Sign in to manage your CityFix reports.";
            authMessage.classList.add("hidden");
        }
        document.getElementById("login-tab").addEventListener("click", () => setMode(false));
        document.getElementById("register-tab").addEventListener("click", () => setMode(true));
        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("login-button");
            button.disabled = true;
            try {
                const response = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: document.getElementById("login-email").value, password: document.getElementById("login-password").value }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Invalid email or password.");
                saveSession(data);
            } catch (error) { showAuthMessage(error.message); } finally { button.disabled = false; }
        });
        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.getElementById("register-password").value;
            if (password !== document.getElementById("register-confirm").value) { showAuthMessage("Passwords do not match."); return; }
            const button = document.getElementById("register-button");
            button.disabled = true;
            try {
                const response = await fetch("/api/auth/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ full_name: document.getElementById("register-name").value, email: document.getElementById("register-email").value, password }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Registration failed.");
                saveSession(data);
            } catch (error) { showAuthMessage(error.message); } finally { button.disabled = false; }
        });
        if (new URLSearchParams(window.location.search).get("tab") === "register") setMode(true);
        const returnNotice = sessionStorage.getItem("cityfix_return_notice");
        if (returnNotice) { showAuthMessage(returnNotice, false); sessionStorage.removeItem("cityfix_return_notice"); }
        lucide.createIcons();
    </script>
</body>
</html>
